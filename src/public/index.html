<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TV Hub</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main>
      <h1>TV HUB</h1>
      <p id="welcome">Loading your session…</p>
      <button id="logout">Logout</button>

      <section class="channels-section">
        <h2>Search</h2>
        <label for="channel-search">Find a channel by name, country, or category</label>
        <input id="channel-search" type="search" placeholder="Search channels..." />
      </section>

      <section class="channels-section">
        <h2>Channels</h2>
        <p id="channel-status">Loading channels from the backend…</p>
        <div id="channel-list" class="channel-grid"></div>
      </section>
    </main>

    <script src="/js/home.js"></script>
  </body>
</html>
